<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 120" width="550" height="120">
  <!-- Terminal icon -->
  <!-- Window frame -->
  <rect x="4" y="4" width="142" height="112" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <!-- Title bar -->
  <rect x="4" y="4" width="142" height="24" rx="8" fill="#161b22"/>
  <!-- Traffic lights -->
  <circle cx="18" cy="16" r="4.5" fill="#ff5f56"/>
  <circle cx="32" cy="16" r="4.5" fill="#ffbd2e"/>
  <circle cx="46" cy="16" r="4.5" fill="#27c93f"/>

  <!-- SSH prompt text in terminal -->
  <text x="22" y="72" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="50" font-weight="bold" fill="#58a6ff">>_</text>

  <!-- Library name -->
  <text
    x="168"
    y="84"
    font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="70"
    font-weight="300"
    letter-spacing="0.5"
    fill="#58a6ff">
      SSH • SFTP
  </text>
</svg>
